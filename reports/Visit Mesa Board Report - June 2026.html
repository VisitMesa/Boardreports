<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visit Mesa Board Report - June 2026</title>
  <style>
    html,body{margin:0;min-height:100%;background:#1B3D6B;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{display:grid;place-items:center}.loading{text-align:center;padding:32px}.loading strong{display:block;font-size:18px;margin-bottom:8px}.loading span{opacity:.78;font-size:14px}
  </style>
</head>
<body>
  <div class="loading" id="loading"><strong>Loading June 2026 report...</strong><span>Please hold for a moment.</span></div>
  <script>
    (async function(){
      const files=[
        "Visit-Mesa-Board-Report-June-2026.part-1.txt",
        "Visit-Mesa-Board-Report-June-2026.part-2.txt",
        "Visit-Mesa-Board-Report-June-2026.part-3.txt",
        "Visit-Mesa-Board-Report-June-2026.part-4.txt"
      ];
      const responses=await Promise.all(files.map(function(file){return fetch(file,{cache:"no-store"});}));
      const failed=responses.find(function(response){return !response.ok;});
      if(failed) throw new Error("A report segment could not be loaded ("+failed.status+").");
      const parts=await Promise.all(responses.map(function(response){return response.text();}));
      document.open();
      document.write(parts.join(""));
      document.close();
    })().catch(function(error){
      const loading=document.getElementById("loading");
      loading.innerHTML="<strong>We could not load the report.</strong><span>"+error.message+" Please refresh the page.</span>";
    });
  </script>
</body>
</html>
